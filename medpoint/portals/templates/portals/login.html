{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login — MEDPOINT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0b0613;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        body::before {
            content: '';
            position: fixed;
            top: -40%;
            right: -20%;
            width: 70%;
            height: 140%;
            background: radial-gradient(ellipse, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -15%;
            width: 50%;
            height: 100%;
            background: radial-gradient(ellipse, rgba(124, 58, 237, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 1.25rem;
            box-shadow: 0 8px 30px rgba(147, 51, 234, 0.35);
        }

        .login-brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #fff;
            margin-bottom: 0.35rem;
        }

        .login-brand p {
            font-size: 0.8rem;
            color: #6b7280;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .login-card {
            background: rgba(26, 16, 37, 0.55);
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 20px;
            padding: 2.25rem;
            backdrop-filter: blur(16px);
        }

        .login-card h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        .login-card .login-sub {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        /* --- Role Selector (compact) --- */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .role-card {
            position: relative;
            cursor: pointer;
            border: 2px solid rgba(168, 85, 247, 0.1);
            border-radius: 12px;
            padding: 0.7rem 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(11, 6, 19, 0.5);
        }

        .role-card:hover {
            border-color: rgba(168, 85, 247, 0.25);
            background: rgba(168, 85, 247, 0.04);
        }

        .role-card.selected {
            border-color: #9333ea;
            background: rgba(147, 51, 234, 0.08);
            box-shadow: 0 0 0 1px rgba(147, 51, 234, 0.3), 0 4px 20px rgba(147, 51, 234, 0.12);
        }

        .role-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .role-card.role-admin .role-icon {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
        }

        .role-card.role-admin.selected .role-icon {
            background: rgba(251, 191, 36, 0.18);
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.15);
        }

        .role-card.role-staff .role-icon {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
        }

        .role-card.role-staff.selected .role-icon {
            background: rgba(96, 165, 250, 0.18);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.15);
        }

        .role-info {
            min-width: 0;
        }

        .role-title {
            font-weight: 600;
            font-size: 0.8rem;
            color: #e5e7eb;
            line-height: 1.2;
        }

        .role-desc {
            font-size: 0.6rem;
            color: #6b7280;
            line-height: 1.3;
        }

        .role-check {
            position: absolute;
            top: 0.45rem;
            right: 0.45rem;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(168, 85, 247, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.45rem;
            color: transparent;
            transition: all 0.3s;
        }

        .role-card.selected .role-check {
            border-color: #9333ea;
            background: #9333ea;
            color: #fff;
        }

        /* --- Form --- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            background: rgba(11, 6, 19, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.12);
            border-radius: 12px;
            color: #f3f4f6;
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrap input:focus {
            border-color: rgba(168, 85, 247, 0.45);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        .input-wrap input:focus ~ i {
            color: #a855f7;
        }

        .input-wrap input::placeholder {
            color: rgba(107, 114, 128, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.02em;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 1.75rem;
        }

        .login-footer a {
            font-size: 0.8rem;
            color: #a855f7;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: #c084fc;
        }

        /* Alert Messages */
        .login-alert {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            animation: slideIn 0.35s ease-out;
        }

        .login-alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .login-alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(168, 85, 247, 0.12);
        }

        .divider span {
            font-size: 0.7rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 1.5rem 1rem;
            }

            .login-card {
                padding: 1.5rem;
                border-radius: 16px;
            }

            .role-card {
                padding: 0.6rem 0.5rem;
            }

            .role-icon {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-brand">
            <div class="login-brand-icon"><i class="fas fa-spa"></i></div>
            <h1>MEDPOINT</h1>
            <p>Management Portal</p>
        </div>

        <div class="login-card">
            <h2>Welcome back</h2>
            <p class="login-sub">Select your role and sign in to continue</p>

            {% if messages %}
            {% for message in messages %}
            <div class="login-alert {% if message.tags == 'success' %}login-alert-success{% else %}login-alert-error{% endif %}">
                <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i>
                <span>{{ message }}</span>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'portals:login' %}" id="login-form">
                {% csrf_token %}

                <!-- Role Selector -->
                <div class="role-selector">
                    <label class="role-card role-admin selected" id="role-admin-card">
                        <input type="radio" name="role" value="admin" checked>
                        <div class="role-check"><i class="fas fa-check"></i></div>
                        <div class="role-icon"><i class="fas fa-user-shield"></i></div>
                        <div class="role-info">
                            <div class="role-title">Admin</div>
                            <div class="role-desc">Full system access</div>
                        </div>
                    </label>
                    <label class="role-card role-staff" id="role-staff-card">
                        <input type="radio" name="role" value="staff">
                        <div class="role-check"><i class="fas fa-check"></i></div>
                        <div class="role-icon"><i class="fas fa-user-tie"></i></div>
                        <div class="role-info">
                            <div class="role-title">Staff</div>
                            <div class="role-desc">Daily operations</div>
                        </div>
                    </label>
                </div>

                <div class="divider"><span>Sign in credentials</span></div>

                <div class="form-group">
                    <label for="login-username">Username</label>
                    <div class="input-wrap">
                        <input type="text" name="username" id="login-username" placeholder="Enter your username"
                            required autofocus>
                        <i class="fas fa-user"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="login-password"
                            placeholder="Enter your password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="login-submit">
                    Sign In <i class="fas fa-arrow-right" style="margin-left: 0.5rem; font-size: 0.8rem;"></i>
                </button>
            </form>
        </div>

        <div class="login-footer">
            <a href="{% url 'website:home' %}"><i class="fas fa-arrow-left" style="margin-right: 0.375rem; font-size: 0.7rem;"></i> Back to Website</a>
        </div>
    </div>

    <script>
        // Role card selection
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
            });
        });
    </script>
</body>

</html>
